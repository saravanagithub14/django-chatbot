<!DOCTYPE html>
<html>
<head>
    <title>OpenAI Chatbot</title>
</head>

<body>

    <h1>AI Chatbot</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="message"
            placeholder="Ask something..."
            required
        >

        <button type="submit">
            Send
        </button>

    </form>


    {% if response %}

        <h3>GPT</h3>

        <p>
            {{ response }}
        </p>

    {% endif %}

</body>
</html>
